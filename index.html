<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JS Mastery — Course Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080c14;
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(255,255,255,0.07);
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.1);
  --glass-strong:rgba(255,255,255,0.12);
  --text:#f0f2ff;
  --muted:rgba(240,242,255,0.5);
  --hint:rgba(240,242,255,0.25);
  --accent:#7c6dfa;
  --accent2:#38d9a9;
  --accent3:#f7b731;
  --accent4:#ff6b9d;
  --d1:#4dabf7;
  --d2:#38d9a9;
  --d3:#ffd43b;
  --d4:#da77f2;
  --r:16px;--rs:10px;
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  overflow-x:hidden;
}

/* animated bg */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.18;animation:orbFloat 12s ease-in-out infinite}
.orb1{width:400px;height:400px;background:#7c6dfa;top:-100px;left:-100px;animation-delay:0s}
.orb2{width:350px;height:350px;background:#38d9a9;top:40%;right:-120px;animation-delay:-4s}
.orb3{width:300px;height:300px;background:#f7b731;bottom:-80px;left:30%;animation-delay:-8s}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(30px,-40px) scale(1.05)}
  66%{transform:translate(-20px,30px) scale(0.97)}
}

.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:24px 16px 60px}

/* header */
.header{margin-bottom:28px}
.header-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent2);font-family:'DM Mono',monospace;margin-bottom:6px;opacity:0.8}
.header h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;background:linear-gradient(135deg,#f0f2ff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-sub{font-size:13px;color:var(--muted);margin-top:4px;font-family:'DM Mono',monospace}

/* total progress ring card */
.progress-card{
  background:var(--glass);
  border:0.5px solid var(--glass-border);
  border-radius:20px;
  padding:20px;
  margin-bottom:24px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:20px;
  position:relative;overflow:hidden;
}
.progress-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(124,109,250,0.08),transparent 60%);
  pointer-events:none;
}
.ring-wrap{position:relative;flex-shrink:0;width:72px;height:72px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{stroke:rgba(255,255,255,0.08);fill:none;stroke-width:5}
.ring-fill{fill:none;stroke-width:5;stroke-linecap:round;
  stroke:url(#ringGrad);
  transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1);
}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:16px;font-weight:800;line-height:1;color:var(--text)}
.ring-pct-sym{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
.progress-info{flex:1}
.progress-info h3{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.progress-chapters{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:10px}
.day-dots{display:flex;gap:6px;flex-wrap:wrap}
.day-dot{display:flex;align-items:center;gap:5px;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* day selector tabs */
.day-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px}
.day-tab{
  position:relative;padding:12px 6px 10px;
  border:0.5px solid var(--glass-border);
  border-radius:var(--r);background:var(--surface);
  cursor:pointer;text-align:center;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
.day-tab::before{
  content:'';position:absolute;inset:0;opacity:0;
  transition:opacity .25s;
}
.day-tab.active::before{opacity:1}
.tab-d1::before{background:linear-gradient(135deg,rgba(77,171,247,0.15),rgba(77,171,247,0.05))}
.tab-d2::before{background:linear-gradient(135deg,rgba(56,217,169,0.15),rgba(56,217,169,0.05))}
.tab-d3::before{background:linear-gradient(135deg,rgba(255,212,59,0.15),rgba(255,212,59,0.05))}
.tab-d4::before{background:linear-gradient(135deg,rgba(218,119,242,0.15),rgba(218,119,242,0.05))}
.day-tab.active{border-color:var(--glass-strong);transform:translateY(-1px)}
.tab-d1.active{border-color:rgba(77,171,247,0.4)}
.tab-d2.active{border-color:rgba(56,217,169,0.4)}
.tab-d3.active{border-color:rgba(255,212,59,0.4)}
.tab-d4.active{border-color:rgba(218,119,242,0.4)}
.tab-num{font-size:10px;font-family:'DM Mono',monospace;color:var(--hint);letter-spacing:.06em;position:relative}
.tab-label{font-size:13px;font-weight:700;color:var(--muted);margin-top:2px;position:relative;transition:color .25s}
.day-tab.active .tab-label{color:var(--text)}
.tab-d1.active .tab-label{color:#4dabf7}
.tab-d2.active .tab-label{color:#38d9a9}
.tab-d3.active .tab-label{color:#ffd43b}
.tab-d4.active .tab-label{color:#da77f2}
.tab-mini-bar{height:2px;border-radius:999px;margin-top:8px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative}
.tab-mini-fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* panels */
.panel{display:none;animation:fadeUp .3s ease both}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* day header inside panel */
.panel-header{
  background:var(--glass);border:0.5px solid var(--glass-border);
  border-radius:20px;padding:18px 20px;margin-bottom:16px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:relative;overflow:hidden;
}
.panel-header::after{
  content:'';position:absolute;top:0;right:0;width:120px;height:120px;
  border-radius:50%;filter:blur(40px);opacity:.12;pointer-events:none;
}
.ph-d1::after{background:#4dabf7}.ph-d2::after{background:#38d9a9}
.ph-d3::after{background:#ffd43b}.ph-d4::after{background:#da77f2}
.panel-day-badge{
  font-size:10px;font-family:'DM Mono',monospace;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 10px;border-radius:999px;
  display:inline-block;margin-bottom:8px;
}
.bd1{background:rgba(77,171,247,0.15);color:#4dabf7;border:0.5px solid rgba(77,171,247,0.3)}
.bd2{background:rgba(56,217,169,0.15);color:#38d9a9;border:0.5px solid rgba(56,217,169,0.3)}
.bd3{background:rgba(255,212,59,0.15);color:#ffd43b;border:0.5px solid rgba(255,212,59,0.3)}
.bd4{background:rgba(218,119,242,0.15);color:#da77f2;border:0.5px solid rgba(218,119,242,0.3)}
.panel-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:4px;letter-spacing:-.01em}
.panel-time{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:14px}
.panel-bar-wrap{height:5px;background:rgba(255,255,255,0.07);border-radius:999px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.pf1{background:linear-gradient(90deg,#4dabf7,#74c0fc)}.pf2{background:linear-gradient(90deg,#38d9a9,#63e6be)}
.pf3{background:linear-gradient(90deg,#ffd43b,#ffe066)}.pf4{background:linear-gradient(90deg,#da77f2,#e599f7)}
.panel-bar-label{font-size:11px;color:var(--muted);margin-top:6px;font-family:'DM Mono',monospace;display:flex;justify-content:space-between}

/* section labels */
.sec-label{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--hint);margin:20px 0 10px;display:flex;align-items:center;gap:8px;
}
.sec-label::after{content:'';flex:1;height:0.5px;background:var(--glass-border)}

/* chapter items */
.chapter-list{display:flex;flex-direction:column;gap:5px}
.ch-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--surface);border:0.5px solid var(--glass-border);
  border-radius:var(--r);cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  position:relative;overflow:hidden;
}
.ch-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:0 2px 2px 0;background:var(--accent);
  transform:scaleY(0);transition:transform .2s cubic-bezier(.4,0,.2,1);
}
.ch-item:active{transform:scale(0.99)}
.ch-item.done{opacity:0.45}
.ch-item.done::before{transform:scaleY(1)}
.ch-item:not(.done):hover{background:var(--surface-hover);border-color:var(--glass-strong)}
.ch-check{
  width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.15);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:all .25s cubic-bezier(.4,0,.2,1);background:transparent;
}
.ch-item.done .ch-check{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 12px rgba(56,217,169,0.4)}
.ch-check svg{opacity:0;transform:scale(0);transition:all .2s cubic-bezier(.4,0,.2,1)}
.ch-item.done .ch-check svg{opacity:1;transform:scale(1)}
.ch-body{flex:1;min-width:0}
.ch-name{font-size:13px;font-weight:600;color:var(--text);transition:color .2s}
.ch-item.done .ch-name{text-decoration:line-through;color:var(--hint)}
.ch-meta{display:flex;align-items:center;gap:6px;margin-top:2px}
.ch-time{font-size:11px;color:var(--hint);font-family:'DM Mono',monospace}
.proj-pill{
  font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;
  background:rgba(247,183,49,0.15);color:#ffd43b;border:0.5px solid rgba(247,183,49,0.3);
}

/* problems */
.prob-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  background:var(--surface);border:0.5px solid var(--glass-border);
  border-radius:var(--r);margin-bottom:5px;
  transition:all .2s;
}
.prob-item:hover{background:var(--surface-hover)}
.prob-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-family:'DM Mono',monospace;font-weight:600}
.pi-easy{background:rgba(56,217,169,0.15);color:#38d9a9}
.pi-medium{background:rgba(255,212,59,0.15);color:#ffd43b}
.pi-custom{background:rgba(124,109,250,0.15);color:#a78bfa}
.prob-name{font-size:13px;color:var(--text);flex:1;line-height:1.3}
.prob-link{
  font-size:11px;padding:4px 10px;border-radius:8px;
  text-decoration:none;font-family:'DM Mono',monospace;font-weight:500;
  flex-shrink:0;transition:all .2s;
}
.pl-easy{background:rgba(56,217,169,0.12);color:#38d9a9;border:0.5px solid rgba(56,217,169,0.25)}
.pl-easy:hover{background:rgba(56,217,169,0.22)}
.pl-medium{background:rgba(255,212,59,0.12);color:#ffd43b;border:0.5px solid rgba(255,212,59,0.25)}
.pl-medium:hover{background:rgba(255,212,59,0.22)}

/* REFRESH SECTION */
.refresh-section{margin-top:24px}
.refresh-header{
  background:linear-gradient(135deg,rgba(124,109,250,0.1),rgba(56,217,169,0.05));
  border:0.5px solid rgba(124,109,250,0.25);
  border-radius:20px;padding:16px 18px;margin-bottom:12px;
}
.refresh-header-title{font-size:13px;font-weight:700;color:#c3b6fc;letter-spacing:-.01em}
.refresh-header-sub{font-size:12px;color:var(--muted);margin-top:2px}

.drb{margin-bottom:8px}
.drb-trigger{
  display:flex;align-items:center;gap:10px;padding:13px 16px;
  background:var(--surface);border:0.5px solid var(--glass-border);
  border-radius:var(--r);cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  user-select:none;
}
.drb-trigger:hover{background:var(--surface-hover);border-color:var(--glass-strong)}
.drb-trigger.open{border-radius:var(--r) var(--r) 0 0;border-color:var(--glass-strong)}
.drb-icon{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;
  font-family:'DM Mono',monospace;
}
.drb-label{font-size:13px;font-weight:700;color:var(--text);flex:1}
.drb-sub{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:1px}
.drb-arrow{
  width:20px;height:20px;border-radius:50%;background:var(--glass);
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s cubic-bezier(.4,0,.2,1);flex-shrink:0;
}
.drb-arrow svg{width:10px;height:10px;fill:var(--muted)}
.drb-trigger.open .drb-arrow{transform:rotate(90deg)}

.drb-body{
  display:none;background:var(--surface);
  border:0.5px solid var(--glass-strong);border-top:none;
  border-radius:0 0 var(--r) var(--r);padding:16px 14px;
}
.drb-body.open{display:block;animation:fadeUp .2s ease both}

/* quiz */
.quiz-card{
  background:rgba(124,109,250,0.06);border:0.5px solid rgba(124,109,250,0.2);
  border-radius:var(--r);padding:16px;margin-bottom:10px;
}
.quiz-counter-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quiz-counter{font-size:10px;font-family:'DM Mono',monospace;color:var(--hint);letter-spacing:.06em;text-transform:uppercase}
.quiz-dots{display:flex;gap:4px}
.qdot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.1);transition:background .2s}
.qdot.answered{background:var(--accent)}
.qdot.current{background:rgba(124,109,250,0.5);box-shadow:0 0 6px rgba(124,109,250,0.5)}
.quiz-q{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;line-height:1.45;letter-spacing:-.01em}
.quiz-opts{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.qopt{
  padding:10px 14px;border-radius:var(--rs);
  border:0.5px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.03);
  color:var(--muted);font-size:13px;font-family:'Syne',sans-serif;
  cursor:pointer;text-align:left;width:100%;
  transition:all .15s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:10px;
}
.qopt-letter{
  width:20px;height:20px;border-radius:5px;background:rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-family:'DM Mono',monospace;color:var(--hint);flex-shrink:0;
  transition:all .15s;
}
.qopt:not(:disabled):hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.2);color:var(--text)}
.qopt:not(:disabled):hover .qopt-letter{background:rgba(124,109,250,0.2);color:var(--accent)}
.qopt:disabled{cursor:default}
.qopt.correct{background:rgba(56,217,169,0.1);border-color:rgba(56,217,169,0.35);color:#63e6be}
.qopt.correct .qopt-letter{background:rgba(56,217,169,0.2);color:#38d9a9}
.qopt.wrong{background:rgba(255,107,107,0.08);border-color:rgba(255,107,107,0.25);color:rgba(255,150,150,0.8)}
.qopt.wrong .qopt-letter{background:rgba(255,107,107,0.15);color:#ff8787}
.quiz-fb{
  font-size:12px;line-height:1.5;color:var(--muted);
  padding:10px 12px;border-radius:8px;
  background:rgba(255,255,255,0.03);
  border-left:2px solid var(--accent);
  margin-bottom:12px;display:none;
}
.quiz-fb.show{display:block;animation:fadeUp .2s ease}
.quiz-next{
  width:100%;padding:10px;border-radius:var(--rs);
  border:0.5px solid rgba(124,109,250,0.3);
  background:rgba(124,109,250,0.1);color:#c3b6fc;
  font-size:13px;font-family:'Syne',sans-serif;font-weight:700;
  cursor:pointer;transition:all .2s;display:none;
}
.quiz-next.show{display:block}
.quiz-next:hover{background:rgba(124,109,250,0.2);border-color:rgba(124,109,250,0.5)}
.score-card{
  background:linear-gradient(135deg,rgba(56,217,169,0.12),rgba(56,217,169,0.04));
  border:0.5px solid rgba(56,217,169,0.3);
  border-radius:var(--r);padding:20px;text-align:center;
}
.score-num{font-size:36px;font-weight:800;color:#38d9a9;line-height:1;letter-spacing:-.03em}
.score-total{font-size:14px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:6px}
.score-msg{font-size:13px;color:#63e6be;margin-bottom:14px;line-height:1.4}
.score-bar-wrap{height:4px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;margin-bottom:14px}
.score-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#38d9a9,#63e6be);transition:width .8s cubic-bezier(.4,0,.2,1)}
.retry-btn{
  padding:9px 20px;border-radius:var(--rs);
  border:0.5px solid rgba(56,217,169,0.3);
  background:rgba(56,217,169,0.1);color:#38d9a9;
  font-size:12px;font-family:'Syne',sans-serif;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.retry-btn:hover{background:rgba(56,217,169,0.2)}

/* custom problems */
.custom-card{
  background:rgba(255,255,255,0.03);border:0.5px solid var(--glass-border);
  border-radius:var(--r);padding:14px;margin-bottom:7px;
  transition:border-color .2s;
}
.custom-card:hover{border-color:var(--glass-strong)}
.cp-tag{
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:999px;
  background:rgba(124,109,250,0.15);color:#a78bfa;
  border:0.5px solid rgba(124,109,250,0.25);
  display:inline-block;margin-bottom:8px;font-family:'DM Mono',monospace;
}
.cp-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:5px;letter-spacing:-.01em}
.cp-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;white-space:pre-line}
.cp-code{
  font-family:'DM Mono',monospace;font-size:12px;
  background:rgba(0,0,0,0.3);border-radius:8px;
  padding:10px 12px;color:#a9b4c9;border:0.5px solid rgba(255,255,255,0.06);
  white-space:pre-wrap;margin-bottom:10px;line-height:1.6;overflow-x:auto;
}
.hint-toggle{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--hint);cursor:pointer;
  background:none;border:none;padding:0;font-family:'Syne',sans-serif;
  transition:color .2s;
}
.hint-toggle:hover{color:var(--accent)}
.hint-toggle svg{width:12px;height:12px;fill:currentColor;transition:transform .25s}
.hint-toggle.open svg{transform:rotate(180deg)}
.hint-text{
  font-size:12px;color:#a78bfa;line-height:1.5;
  padding:9px 12px;border-radius:8px;
  background:rgba(124,109,250,0.08);border:0.5px solid rgba(124,109,250,0.15);
  margin-top:8px;display:none;
}
.hint-text.open{display:block;animation:fadeUp .2s ease}

/* reset */
.reset-wrap{margin-top:32px;text-align:center}
.reset-btn{
  background:none;border:0.5px solid rgba(255,255,255,0.07);
  border-radius:8px;padding:8px 16px;
  font-size:11px;color:var(--hint);cursor:pointer;
  font-family:'DM Mono',monospace;letter-spacing:.04em;
  transition:all .2s;
}
.reset-btn:hover{border-color:rgba(255,107,107,0.3);color:#ff8787}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(20,24,36,0.95);border:0.5px solid var(--glass-border);

let state={},activeDay=0,quizSt={},openBlocks={};
const letters=['A','B','C','D'];

function load(){try{state=JSON.parse(localStorage.getItem('jsm4')||'{}')}catch(e){state={}}}
function save(){localStorage.setItem('jsm4',JSON.stringify(state))}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function toggleCh(id){
  const was=state[id];
  state[id]=!state[id];save();
  const el=document.querySelector('.ch-item[data-id="'+id+'"]');
  if(el) el.classList.toggle('done',!!state[id]);
  if(!was) showToast('Chapter done ✓');
  updateAllProgress();
}

function updateAllProgress(){
  const all=DAYS.flatMap(d=>d.chapters);
  const done=all.filter(c=>state[c.id]).length;
  const pct=Math.round(done/all.length*100);
  const circ=188.5;
  const offset=circ-(circ*pct/100);
  document.getElementById('ring-fill').style.strokeDashoffset=offset;
  document.getElementById('ring-pct').textContent=pct;
  document.getElementById('total-chapters').textContent=done+' / '+all.length+' done';

  DAYS.forEach(day=>{
    const dd=day.chapters.filter(c=>state[c.id]).length;
    const dt=day.chapters.length;
    const dp=Math.round(dd/dt*100);
    const bar=document.querySelector('.pbar-'+day.id);
    if(bar) bar.style.width=dp+'%';
    const lbl=document.querySelector('.pbar-label-'+day.id);
    if(lbl) lbl.textContent=dd+'/'+dt;
    const tmb=document.querySelector('.tmb-'+day.id);
    if(tmb) tmb.style.width=dp+'%';
    const dot=document.querySelector('.ddot-'+day.id);
    if(dot) dot.textContent=dd+'/'+dt;
  });
}

function switchDay(i){
  activeDay=i;
  document.querySelectorAll('.day-tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));
}

function toggleBlock(bk){
  openBlocks[bk]=!openBlocks[bk];
  const trigger=document.querySelector('.drbt-'+bk);
  const body=document.getElementById('drbb-'+bk);
  if(trigger) trigger.classList.toggle('open',!!openBlocks[bk]);
  if(body) body.classList.toggle('open',!!openBlocks[bk]);
}

function answerQ(bk,chosen){
  const st=quizSt[bk];if(!st||st.answered||st.done)return;
  const parts=bk.split('-');
  const di=parseInt(parts[0]),pdi=parseInt(parts[1]);
  const pd=REFRESH[di].days[pdi];
  const q=pd.quiz[st.idx];
  st.answered=true;st.chosen=chosen;
  if(chosen===q.ans)st.score++;
  const opts=document.querySelectorAll('.qopts-'+bk+' .qopt');
  opts.forEach((o,i)=>{
    o.disabled=true;
    if(i===q.ans)o.classList.add('correct');
    else if(i===chosen&&i!==q.ans)o.classList.add('wrong');
  });
  const fb=document.getElementById('qfb-'+bk);
  if(fb){fb.textContent=q.exp;fb.classList.add('show')}
  const nx=document.getElementById('qnx-'+bk);
  if(nx)nx.classList.add('show');
  updateQuizDots(bk,pd.quiz.length,st.idx,true);
}

function nextQ(bk){
  const st=quizSt[bk];
  const parts=bk.split('-');
  const di=parseInt(parts[0]),pdi=parseInt(parts[1]);
  const pd=REFRESH[di].days[pdi];
  st.idx++;st.answered=false;st.chosen=null;
  if(st.idx>=pd.quiz.length){st.done=true;renderScoreCard(bk,st,pd.quiz.length);return;}
  renderQuizQ(bk,pd,st);
}

function retryQ(bk){
  const parts=bk.split('-');
  const di=parseInt(parts[0]),pdi=parseInt(parts[1]);
  const pd=REFRESH[di].days[pdi];
  quizSt[bk]={idx:0,score:0,answered:false,done:false,chosen:null};
  renderQuizQ(bk,pd,quizSt[bk]);
}

function updateQuizDots(bk,total,idx,answered){
  const container=document.getElementById('qdots-'+bk);
  if(!container)return;
  const st=quizSt[bk]||{};
  container.innerHTML=Array.from({length:total},(_,i)=>{
    let cls='qdot';
    if(i<idx)cls+=' answered';
    else if(i===idx)cls+=answered?' answered':' current';
    return '<div class="'+cls+'"></div>';
  }).join('');
}

function renderQuizQ(bk,pd,st){
  const qc=document.getElementById('qcontent-'+bk);
  if(!qc)return;
  const q=pd.quiz[st.idx];
  qc.innerHTML=`
    <div class="quiz-counter-row">
      <div class="quiz-counter">Question ${st.idx+1} of ${pd.quiz.length}</div>
      <div class="quiz-dots" id="qdots-${bk}">
        ${Array.from({length:pd.quiz.length},(_,i)=>`<div class="qdot${i===st.idx?' current':''}"></div>`).join('')}
      </div>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts qopts-${bk}">
      ${q.opts.map((o,i)=>`
        <button class="qopt" onclick="answerQ('${bk}',${i})">
          <span class="qopt-letter">${letters[i]}</span>
          ${o}
        </button>
      `).join('')}
    </div>
    <div class="quiz-fb" id="qfb-${bk}"></div>
    <button class="quiz-next" id="qnx-${bk}" onclick="nextQ('${bk}')">Next question →</button>
  `;
}

function renderScoreCard(bk,st,total){
  const qc=document.getElementById('qcontent-'+bk);
  if(!qc)return;
  const pct=Math.round(st.score/total*100);
  const msg=pct>=80?'Excellent recall! You\'re ready to crush today.':pct>=50?'Decent! Worth a quick skim of the tricky spots.':'Recommend re-reading that day before diving in.';
  qc.innerHTML=`
    <div class="score-card">
      <div class="score-num">${st.score}</div>
      <div class="score-total">out of ${total} correct</div>
      <div class="score-bar-wrap"><div class="score-bar-fill" style="width:${pct}%"></div></div>
      <div class="score-msg">${msg}</div>
      <button class="retry-btn" onclick="retryQ('${bk}')">↺ Retry quiz</button>
    </div>
  `;
}

function toggleHint(id){
  const btn=document.getElementById('hbtn-'+id);
  const txt=document.getElementById('htxt-'+id);
  if(!btn||!txt)return;
  const open=txt.classList.toggle('open');
  btn.classList.toggle('open',open);
}

function resetAll(){
  if(confirm('Reset all progress? This cannot be undone.')){
    state={};save();
    document.querySelectorAll('.ch-item').forEach(el=>el.classList.remove('done'));
    updateAllProgress();
    showToast('Progress reset');
  }
}

function buildTabs(){
  const container=document.getElementById('day-tabs');
  const dots=document.getElementById('day-dots');
  container.innerHTML='';dots.innerHTML='';
  DAYS.forEach((day,i)=>{
    const done=day.chapters.filter(c=>state[c.id]).length;
    const pct=Math.round(done/day.chapters.length*100);
    const tab=document.createElement('div');
    tab.className='day-tab '+day.tcls+(i===activeDay?' active':'');
    tab.onclick=()=>switchDay(i);
    tab.innerHTML=`
      <div class="tab-num">0${i+1}</div>
      <div class="tab-label">${day.label}</div>
      <div class="tab-mini-bar">
        <div class="tab-mini-fill tmb-${day.id}" style="width:${pct}%;background:${day.color}"></div>
      </div>
    `;
    container.appendChild(tab);
    const dot=document.createElement('div');
    dot.className='day-dot';
    dot.innerHTML=`<div class="dot" style="background:${day.color}"></div><span class="ddot-${day.id}">${done}/${day.chapters.length}</span>`;
    dots.appendChild(dot);
  });
}

function buildPanels(){
  const container=document.getElementById('panels');
  container.innerHTML='';
  DAYS.forEach((day,di)=>{
    const done=day.chapters.filter(c=>state[c.id]).length;
    const total=day.chapters.length;
    const pct=Math.round(done/total*100);
    const panel=document.createElement('div');
    panel.className='panel'+(di===activeDay?' active':'');
    panel.id='panel-'+di;

    let html=`
      <div class="panel-header ph-d${di+1}">
        <div class="panel-day-badge ${day.badge}">${day.label}</div>
        <div class="panel-title">${day.theme}</div>
        <div class="panel-time">${day.time}</div>
        <div class="panel-bar-wrap">
          <div class="panel-bar-fill ${day.pfill} pbar-${day.id}" style="width:${pct}%"></div>
        </div>
        <div class="panel-bar-label">
          <span class="pbar-label-${day.id}">${done}/${total}</span>
          <span>${pct}%</span>
        </div>
      </div>

      <div class="sec-label">Chapters</div>
      <div class="chapter-list">
        ${day.chapters.map(c=>`
          <div class="ch-item${state[c.id]?' done':''}" data-id="${c.id}" onclick="toggleCh('${c.id}')">
            <div class="ch-check">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M1.5 5L4 7.5L8.5 2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="ch-body">
              <div class="ch-name">${c.name}${c.star?'<span class="proj-pill">project</span>':''}</div>
              <div class="ch-meta">
                <span class="ch-time">${c.time}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="sec-label">Practice problems</div>
      ${day.problems.map(p=>`
        <div class="prob-item">
          <div class="prob-icon ${p.level==='easy'?'pi-easy':'pi-medium'}">${p.level==='easy'?'E':'M'}</div>
          <span class="prob-name">${p.name}</span>
          <a class="prob-link ${p.level==='easy'?'pl-easy':'pl-medium'}" href="${p.url}" target="_blank">Open →</a>
        </div>
      `).join('')}
    `;

    const ref=REFRESH[di];
    if(ref){
      html+=`
        <div class="refresh-section">
          <div class="refresh-header">
            <div class="refresh-header-title">↻ Refresh before Day ${di+1}</div>
            <div class="refresh-header-sub">Quiz + problems for each previous day</div>
          </div>
      `;
      ref.days.forEach((pd,pdi)=>{
        const bk=`${di}-${pdi}`;
        if(!quizSt[bk]) quizSt[bk]={idx:0,score:0,answered:false,done:false,chosen:null};
        const isOpen=!!openBlocks[bk];
        html+=`
          <div class="drb">
            <div class="drb-trigger drbt-${bk}${isOpen?' open':''}" onclick="toggleBlock('${bk}')">
              <div class="drb-icon" style="background:${pd.color}22;color:${pd.color};border:0.5px solid ${pd.color}44">${pd.icon||pd.dayLabel.replace('Day ','D')}</div>
              <div style="flex:1">
                <div class="drb-label">${pd.dayLabel} concepts</div>
                <div class="drb-sub">${pd.quiz.length} quiz · ${pd.external.length} linked · ${pd.custom.length} challenges</div>
              </div>
              <div class="drb-arrow">
                <svg viewBox="0 0 8 12"><path d="M1 1l6 5-6 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>
              </div>
            </div>
            <div class="drb-body${isOpen?' open':''}" id="drbb-${bk}">
              <div class="sec-label" style="margin-top:0">Quick quiz</div>
              <div class="quiz-card">
                <div id="qcontent-${bk}">
                  ${buildQuizHTML(bk,pd,quizSt[bk])}
                </div>
              </div>

              <div class="sec-label">Linked problems</div>
              ${pd.external.map(p=>`
                <div class="prob-item">
                  <div class="prob-icon ${p.level==='easy'?'pi-easy':'pi-medium'}">${p.level==='easy'?'E':'M'}</div>
                  <span class="prob-name">${p.name}</span>
                  <a class="prob-link ${p.level==='easy'?'pl-easy':'pl-medium'}" href="${p.url}" target="_blank">Open →</a>
                </div>
              `).join('')}

              <div class="sec-label">Write-it-yourself</div>
              <p style="font-size:12px;color:var(--muted);margin-bottom:10px">Solve in browser console or a JS playground.</p>
              ${pd.custom.map((cp,ci)=>{
                const hid=`${bk}-${ci}`;
                return `
                <div class="custom-card">
                  <div class="cp-tag">challenge</div>
                  <div class="cp-title">${cp.title}</div>
                  <div class="cp-desc">${cp.desc}</div>
                  <div class="cp-code">${cp.eg}</div>
                  <button class="hint-toggle" id="hbtn-${hid}" onclick="toggleHint('${hid}')">
                    <svg viewBox="0 0 12 12"><path d="M6 1a5 5 0 100 10A5 5 0 006 1zm0 8v-4m0-2V3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg>
                    Show hint
                  </button>
                  <div class="hint-text" id="htxt-${hid}">${cp.hint}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
        `;
      });
      html+=`</div>`;
    }

    panel.innerHTML=html;
    container.appendChild(panel);
  });
}

function buildQuizHTML(bk,pd,st){
  if(st.done){
    const pct=Math.round(st.score/pd.quiz.length*100);
    const msg=pct>=80?'Excellent recall! Ready to go.':pct>=50?'Decent — skim the weak spots.':'Recommend re-reading before continuing.';
    return `<div class="score-card">
      <div class="score-num">${st.score}</div>
      <div class="score-total">out of ${pd.quiz.length} correct</div>
      <div class="score-bar-wrap"><div class="score-bar-fill" style="width:${pct}%"></div></div>
      <div class="score-msg">${msg}</div>
      <button class="retry-btn" onclick="retryQ('${bk}')">↺ Retry quiz</button>
    </div>`;
  }
  const q=pd.quiz[st.idx];
  return `
    <div class="quiz-counter-row">
      <div class="quiz-counter">Question ${st.idx+1} of ${pd.quiz.length}</div>
      <div class="quiz-dots" id="qdots-${bk}">
        ${Array.from({length:pd.quiz.length},(_,i)=>`<div class="qdot${i===st.idx?' current':''}"></div>`).join('')}
      </div>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts qopts-${bk}">
      ${q.opts.map((o,i)=>`
        <button class="qopt" onclick="answerQ('${bk}',${i})">
          <span class="qopt-letter">${letters[i]}</span>${o}
        </button>
      `).join('')}
    </div>
    <div class="quiz-fb" id="qfb-${bk}"></div>
    <button class="quiz-next" id="qnx-${bk}" onclick="nextQ('${bk}')">Next question →</button>
  `;
}

load();
buildTabs();
buildPanels();
updateAllProgress();
</script>
</body>
</html>
